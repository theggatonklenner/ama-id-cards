# Keeps the free Supabase project from pausing by making a small request every 3 days.
# It reads the project URL and public key from docs/config.js, so there is nothing to set up.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 21 */3 * *"   # every 3 days, early morning Sydney time
  workflow_dispatch:           # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          URL=$(grep -oP "SUPABASE_URL:\s*'\K[^']+" docs/config.js)
          KEY=$(grep -oP "SUPABASE_ANON_KEY:\s*'\K[^']+" docs/config.js)
          if [ -z "$URL" ] || [ -z "$KEY" ] || echo "$KEY" | grep -q "YOUR-"; then
            echo "docs/config.js is not filled in yet."; exit 1
          fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/settings?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Supabase answered with HTTP $STATUS"
          [ "$STATUS" -lt 500 ]
